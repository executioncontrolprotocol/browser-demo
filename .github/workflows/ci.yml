# Verify-only: secrets scan, typecheck, test, and build.
# Does not deploy. GitHub Pages stays on push to main (pages.yml).
name: ci

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: browser-demo
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-demo/package-lock.json
      - working-directory: browser-demo
        run: npm ci
      - name: Secretlint (working tree)
        working-directory: browser-demo
        run: npm run secrets:scan
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks (git history)
        working-directory: browser-demo
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: browser-demo
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-demo/package-lock.json
      - working-directory: browser-demo
        run: npm ci
      - working-directory: browser-demo
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: browser-demo
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-demo/package-lock.json
      - working-directory: browser-demo
        run: npm ci
      - working-directory: browser-demo
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: browser-demo
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-demo/package-lock.json
      - working-directory: browser-demo
        run: npm ci
      - working-directory: browser-demo
        run: npm run build
