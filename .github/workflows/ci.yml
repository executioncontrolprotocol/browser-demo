name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: browser-demo
      - uses: actions/checkout@v5
        with:
          repository: executioncontrolprotocol/executioncontrolprotocol
          path: executioncontrolprotocol
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-demo/package-lock.json
      - name: Build ECP format-reactflow (file: dependency)
        working-directory: executioncontrolprotocol
        run: |
          npm ci
          npm run build -w @executioncontrolprotocol/types
          npm run build -w @executioncontrolprotocol/core
          npm run build -w @executioncontrolprotocol/format-reactflow
      - working-directory: browser-demo
        run: npm ci
      - name: Secretlint (working tree)
        working-directory: browser-demo
        run: npm run secrets:scan
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks (git history)
        working-directory: browser-demo
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  ci:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v5
        with:
          path: browser-demo
      - uses: actions/checkout@v5
        with:
          repository: executioncontrolprotocol/executioncontrolprotocol
          path: executioncontrolprotocol
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            browser-demo/package-lock.json
            executioncontrolprotocol/package-lock.json
      - name: Build ECP format-reactflow (file: dependency)
        working-directory: executioncontrolprotocol
        run: |
          npm ci
          npm run build -w @executioncontrolprotocol/types
          npm run build -w @executioncontrolprotocol/core
          npm run build -w @executioncontrolprotocol/format-reactflow
      - working-directory: browser-demo
        run: npm ci
      - working-directory: browser-demo
        run: npm run typecheck
      - working-directory: browser-demo
        run: npm test
      - working-directory: browser-demo
        run: npm run build
